name: Daily board email

# Sent by GitHub, not by the laptop, on purpose.
#
# The laptop that builds this board sleeps, and a local mailer would go quiet
# on exactly the days the board went stale — the days worth being told about.
# Running here means the email always arrives and can say "nothing published
# today" when that is the truth.
#
# GitHub cron is UTC and does not follow daylight saving, so both offsets are
# listed and a guard step drops the run that fires at the wrong local hour.

on:
  schedule:
    - cron: "45 23 * * *"   # 6:45 PM ET while on EST
    - cron: "45 22 * * *"   # 6:45 PM ET while on EDT
  workflow_dispatch:         # manual send, for testing

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether this run owns today
        id: guard
        env:
          SCHED: ${{ github.event.schedule }}
        run: |
          # WHICH CRON OWNS TODAY, decided by the schedule that triggered this
          # run rather than by the clock when it happens to execute.
          #
          # The previous version required the Eastern hour to be exactly 18.
          # GitHub routinely delivers scheduled runs late -- these were landing
          # four and five hours behind -- so the hour never matched and the
          # email silently skipped every single day while the run still
          # reported success. Reading github.event.schedule is immune to that
          # delay: the 23:45 UTC entry is 18:45 Eastern on standard time, the
          # 22:45 UTC entry is 18:45 Eastern on daylight time, and exactly one
          # of them is correct on any given date.
          OFFSET=$(TZ=America/New_York date +%z)
          NOW=$(TZ=America/New_York date '+%Y-%m-%d %H:%M')
          echo "triggered by: ${{ github.event_name }} / cron '${SCHED}'"
          echo "eastern now : ${NOW} (UTC offset ${OFFSET})"
          GO=no
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            GO=yes
          elif [ "$OFFSET" = "-0500" ] && [ "$SCHED" = "45 23 * * *" ]; then
            GO=yes   # standard time
          elif [ "$OFFSET" = "-0400" ] && [ "$SCHED" = "45 22 * * *" ]; then
            GO=yes   # daylight time
          fi
          echo "go=$GO" >> "$GITHUB_OUTPUT"
          if [ "$GO" = "no" ]; then
            echo "This cron entry does not own today's send; the other one does."
          fi

      - name: Compose the email
        if: steps.guard.outputs.go == 'yes'
        id: mail
        run: python .github/compose_email.py

      - name: Send
        if: steps.guard.outputs.go == 'yes'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Scorer Board
          to: ${{ secrets.MAIL_TO }}
          subject: ${{ steps.mail.outputs.subject }}
          html_body: file://email.html
